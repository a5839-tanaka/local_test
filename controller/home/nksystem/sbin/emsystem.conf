#---------------------------------------------------------------------------------------------------
# NK-EMS 2系列情報設定ファイル
#---------------------------------------------------------------------------------------------------
# 本設定ファイルに設定値を定義することにより、プログラムの初期値と異なる値で運用することができる。
# 本設定ファイルは /home/nksystem/sbin/emsystem.conf に配置すること
#
# 設定項目:
#  No | 項目名                                       | 初期値     | 設定ファイル定義名 | 設定範囲
# ----+----------------------------------------------+------------+--------------------+------------
# ( 0)| 共通ホスト名                                 | nksystem   | HOSTNAME_COMM      | 64文字以内
# ( 1)| １系ホスト名（サービス用ネットワーク側）     | nksystem1  | HOSTNAME_1KEI      | 64文字以内
# ( 2)| ２系ホスト名（サービス用ネットワーク側）     | nksystem1s | HOSTNAME_1KEIS     | 64文字以内
# ( 3)| １系ホスト名（系列間ネットワーク側）         | nksystem2  | HOSTNAME_2KEI      | 64文字以内
# ( 4)| ２系ホスト名（系列間ネットワーク側）         | nksystem2s | HOSTNAME_2KEIS     | 64文字以内
# ( 5)| ネットワークI/F名（サービス用ネットワーク側）| enp2s0     | NETDEVNAME_SERVI   | 64文字以内
# ( 6)| ネットワークI/F名（系列間用ネットワーク側）  | enp3s0     | NETDEVNAME_INTER   | 64文字以内
# ( 7)| 死活監視情報送信元ポート番号(UDP)            | 9650       | LIFCHK_SND_PORT    | 1025-99999
# ( 8)| 死活監視情報受信ポート番号(UDP)              | 9660       | LIFCHK_RCV_PORT    | 1025-99999
# ( 9)| 死活監視情報送信周期(秒)                     | 1          | LIFCHK_SND_TIME    | 1-10
# (10)| 死活監視情報受信タイムアウト(秒)             | 3          | LIFCHK_RCV_TIME    | 2-20
# (11)| 等価リソース名                               | r0         | DRBD_RESOURCE      | 64文字以内
# (12)| 等価デバイス名                               | /dev/drbd0 | DRBD_DEVICE        | 64文字以内
# (13)| 運用モード業務アプリサービス名               | なし       | APP_SERVICE_NAME   | 64文字以内
# (14)| 運用モード動作監視プロセス名                 | なし       | APP_RUNCHECK_1     | 64文字以内
# (15)| 運用モード動作監視プロセス名                 | なし       | APP_RUNCHECK_2     | 64文字以内
# (16)| ログレベル                                   | 3          | LOG_LEVEL          | 1-3
# (17)| ＤＲＢＤサービス動作確認周期                 | 5          | DRBD_CHECK_TIME    | 分：1-300
# (18)| 時刻同期サービス名                           | なし       | TIMESYNC_SERV_NAME | 64文字以内
# (19)| 運用モード遷移時の時刻同期チェック           | 0          | TIMESYNC_CHECK     | 0,1
# 
# <<< 装置構成 >>>
#                   |  <--------- (0)hostname ---------->  |
#                   |(1)hostname                           |(3)hostname
#         +---------+--------+                   +---------+--------+
#         |  (5)I/F [enp2s0] |                   |  (5)I/F [enp2s0] |
#         |                  |(2)hostname        |                  |
#         |   (6)I/F [enp3s0]+-------------------+(6)I/F [enp3s0]   |
#         |                  |        (4)hostname|                  |
#         +------------------+                   +------------------+
#
# 注意：ホスト名は全て /etc/hosts ファイルに IPアドレスとともに定義すること
# 注意：ネットワークI/F名は、ネットワークデバイスおよびネットワークケーブルの健全性確認に使用する
# 注意：自装置のホスト名は /etc/hostname の定義と一致するころ
#
# <<< 死活監視情報 >>>
#
#  下図に示す通り、２つのルート（サービス用ネットワーク、系列間ネットワーク）を使用して、死活監視
#  情報を送受信する。
#  死活監視情報には、送信元装置の装置モード（運用、待機、停止、準備、不明）とネットワークI/Fの状態
#  が格納される
#                 +------------------------------------------+
#                 |   +----------------------------------+   |
#                 |   |     (Service Network route)      |   |
#                 |   V                                  |   v
#         +------------------+                   +------------------+
#         |  (7)UDP  (8)UDP  |                   |  (7)UDP  (8)UDP  |
#         |                  |                   |                  |
#         |            (7)UDP|------------------>|(8)UDP            |
#         |            (8)UDP|<------------------|(7)UDP            |
#         +------------------+ (Internal Route)  +------------------+
#
# 注意：死活監視情報の受信ポート番号を変更する際は、Firewall の設定を合わせて変更すること
# 
# <<< 二重化（ＤＲＢＤ）リソース情報 >>>
#
#  系列間ネットワークを使用して、ディスク情報（デフォルトリソース名：r0）を等価する。
#  ＤＲＢＤリソース r0 は、ＯＳ上では /dev/drbd0 としてアクセス可能
#  実際の設定は、/etc/drbd.d/r0.res を参照
#
#                   |                                      |  
#         +---------+--------+                   +---------+--------+
#         |                  |    ディスク等価   |                  |
#         | (11)[ r0 ]       |<----------------->| (11)[ r0 ]       |
#         | (12)[/dev/drbd0] |                   | (12)[/dev/drbd0] |
#         |                  |                   |                  |
#         +------------------+                   +------------------+
# 
# <<< 運用モード業務アプリ（サービス）名称 >>>
#  装置モードが「運用」モードに遷移する際、および、「運用」モードから他のモードに移行する際に、
#  業務アプリケーションの起動／停止を行うためのサービス名称を指定する。
#  設定例） APP_SERVICE_NAME = nksystem.service
#    装置モードが「運用」に遷移する場合、 systemctl start nksystem.service を実行
#    装置モードが「運用」から他のモードに遷移する場合、 systemctl stop nksystem.service を実行
#
# <<< 運用モード監視アプリ情報 >>>
#
#  装置モードが「運用」モードの場合に、監視するプロセスを最大２つまで登録できる。
#  APP_RUNCHECK_1 と APP_RUNCHECK_2 にひとつずつプロセスを指定することができる。
#  指定がない場合はプロセスの動作監視は行わない。一つでもプロセスが指定されてい
#  る場合は、指定されたプロセスの動作確認を行い、動作していない場合は、待機モード
#  に遷移する。
#  設定例）APP_RUNCHECK_1 = nkmanage
#    装置モードが「運用」モードの場合、nkmanage プロセスが動作しているか確認し、動作していない
#    場合は、装置モードを「待機」に移行する。
#
# <<< 二重化（ＤＲＢＤ）リソース情報 >>>
#
#  二重化（ＤＲＢＤ）サービスの動作状態を監視し、ＤＲＢＤサービスが起動していない場合は、
#  systemctl start drbd.service コマンドでＤＲＢＤサービスの起動を試みる。
#  サービスの起動状態を確認する周期を分単位（1～300分の範囲）で指定する。
#  何も指定しない場合のデフォルト値は 5（分）
#
#共通ホスト名（現行バージョンでは使用しない）
#HOSTNAME_COMM    = nksystem
HOSTNAME_COMM    =   
#
#１系ホスト名（サービス用ネットワーク側）
HOSTNAME_1KEI    = nksystem1
#１系ホスト名（系列間ネットワーク側）
HOSTNAME_1KEIS   = nksystem1s
#
#２系ホスト名（サービス用ネットワーク側）
HOSTNAME_2KEI    = nksystem2
#２系ホスト名（系列間ネットワーク側）
HOSTNAME_2KEIS   = nksystem2s
#
#ネットワークI/F名（サービス用ネットワーク側）
NETDEVNAME_SERVI = enp2s0
#ネットワークI/F名（系列間用ネットワーク側）
NETDEVNAME_INTER = enp3s0
#
#死活監視情報送信元ポート番号(UDP)
LIFCHK_SND_PORT  = 9650
#死活監視情報受信ポート番号(UDP)
LIFCHK_RCV_PORT  = 9660
#
#死活監視情報送信周期(秒) 
LIFCHK_SND_TIME  = 1
#死活監視情報受信タイムアウト(秒)
LIFCHK_RCV_TIME  = 5
#
#等価リソース名
DRBD_RESOURCE    = r0
#等価デバイス名
DRBD_DEVICE      = /dev/drbd0 
#
#運用モード業務アプリサービス名
APP_SERVICE_NAME = nksystem.service
#
#運用モード動作監視プロセス名
APP_RUNCHECK_1   = nkmanage
#運用モード動作監視プロセス名
APP_RUNCHECK_2   = 
#
#ログレベル
LOG_LEVEL = 3
#
#ＤＲＢＤサービス動作確認周期（分：1-300）
DRBD_CHECK_TIME = 2
#
#時刻同期サービス名
TIMESYNC_SERV_NAME = chronyd
#
#運用モード遷移時の時刻同期チェック（0：チェックしない、1：チェックする）
TIMESYNC_CHECK = 0
